unbind C-b
set -g prefix C-Space
bind r source ~/.tmux.conf
bind-key C-Space last-window
setw -g mode-keys vi
set -g mouse on
bind m set -g mouse
# Create new window in same PWD (required since 1.9)
bind-key c neww -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

# Enable extended keys for shift+enter support (e.g. Claude Code newline).
# "always" forces tmux to forward CSI-u sequences to apps unconditionally;
# "on" would only forward them after the app requests them via CSI > 1 u,
# which Claude Code doesn't do reliably through a tmux layer.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Clipboard via OSC 52, so copies reach the Mac clipboard across SSH and nested tmux.
# "on" (default is "external") also accepts OSC 52 sent by apps inside panes
# (Claude Code, an inner tmux over SSH, vim, ...) and forwards it to the terminal.
set -s set-clipboard on
# Tell tmux that an outer tmux/screen accepts OSC 52 too (xterm* already does
# by default). Without this, an inner tmux on the VM never forwards the copy.
# RGB: pass the hex status colours below through to an inner tmux as well.
set -as terminal-features ',tmux*:clipboard:RGB,screen*:clipboard:RGB'
# Let apps wrap escape sequences in DCS passthrough (some clipboard paths use it).
set -g allow-passthrough on

# toggle keybindings source: https://www.freecodecamp.org/news/tmux-in-practice-local-and-nested-remote-tmux-sessions-4f7ba5db8795/
# Gruvbox dark (medium) palette, matching the iTerm theme
color_status_text="#a89984"                  # fg4
color_window_off_status_bg="#504945"         # bg2
color_light="#ebdbb2"                        # fg
color_dark="#282828"                         # bg0
color_tab_bg="#3c3836"                       # bg1
color_window_off_status_current_bg="#a89984" # fg4
color_window_off_indicator="#cc241d"         # red, badge behind "OFF"
# Powerline arrow (U+E0B0), needs a Nerd/Powerline font in the terminal
separator_powerline_right="\uE0B0"

# Normal (keys on) state: tmux's default green bar (themed by iTerm), current
# window as a gruvbox bg1 powerline tab. F12 swaps in the greyed-out "off" look.
color_status_bg="green"
setw -g window-status-current-style "fg=$color_light,bold,bg=$color_tab_bg"
setw -g window-status-current-format "#[fg=$color_status_bg,bg=$color_tab_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_tab_bg,bg=$color_status_bg]$separator_powerline_right#[default]"

bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
  set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
  set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

# A tmux started over SSH is the inner one: leave F12 to the outer (local) tmux,
# so the same config works on host and VM without local edits.
if-shell '[ -n "$SSH_CONNECTION" ]' 'unbind -T root F12; unbind -T off F12'

# Status widgets: "OFF" badge while F12 has passed keys through to the inner tmux,
# and user@host so the outer (Mac) and inner (VM) status bars are told apart.
wg_is_keys_off="#{?#{==:#{client_key_table},off},#[fg=$color_light#,bg=$color_window_off_indicator#,bold] OFF #[default] ,}"
wg_user_host="#{user}@#h"

set -g status-right "$wg_is_keys_off$wg_user_host "

# List of plugins
# Legacy: Uncomment the following line if you don't use brew on linux
# if-shell '[[ "$OSTYPE" != "darwin"* ]]' "set -g @plugin 'tmux-plugins/tpm'"
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm'
# Legacy: Use the following 2 lines instead if you don't use brew on linux
# if-shell '[[ "$OSTYPE" == "darwin"* ]]' "run '$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm'"
# if-shell '[[ "$OSTYPE" != "darwin"* ]]' "run -b '~/.tmux/plugins/tpm/tpm'"
